<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Libre+Baskerville&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }
    .attribution a { color: hsl(228, 45%, 44%); }

    * {   
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    /* ===== MOBILE FIRST (default) ===== */
    body {
      background-color: hsl(257, 40%, 49%);
      background-image: url("./images/bg-mobile.svg");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: top center;
      padding: 40px 25px 30px;
      min-height: 100vh;
    }

    header img {
      width: 150px;
      margin-bottom: 55px;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
    }

    .left {
      width: 100%;
    }

    .main-img {
      width: 100%;
      height: auto;
    }

    .right {
      width: 100%;
      text-align: center;
    }

    .title {
      font-family: 'Poppins', sans-serif;
      color: white;
      font-weight: 600;
      font-size: 24px;
      line-height: 1.5;
    }

    .text {
      font-family: 'Open Sans', sans-serif; 
      color: white;
      font-weight: 400;
      font-size: 16px;
      line-height: 1.6;
      padding-top: 20px;
      padding-bottom: 25px;
    }

    .button {
      font-family: 'Poppins', sans-serif;
      color: hsl(257, 40%, 49%);
      background-color: white;
      font-weight: 400;
      font-size: 14px;
      border-radius: 28px;
      border: none;
      padding: 14px 70px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
      display: inline-block;
    }

    .button:hover {
      color: white;
      background-color: hsl(300, 69%, 71%);
    }

    .footer {
      display: flex;
      justify-content: center;
      margin-top: 60px;
    }

    .footer .footer-logo {
      display: flex;
      gap: 15px;
    }

    .footer .icon-circle {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 35px;
      height: 35px;
      border: 1px solid white;
      border-radius: 50%;
      color: white;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s, border-color 0.3s;
    }

    .footer .icon-circle:hover {
      color: hsl(300, 69%, 71%);
      border-color: hsl(300, 69%, 71%);
    }

    /* ===== DESKTOP (min-width: 768px) ===== */
    @media (min-width: 768px) {
      body {
        background-image: url("./images/bg-desktop.svg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        padding: 60px 80px 40px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header img {
        width: 200px;
        margin-bottom: 0;
      }

      .main {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 60px;
        flex: 1;
        padding: 40px 0;
      }

      .left {
        flex: 1.1;
      }

      .main-img {
        width: 100%;
        height: auto;
      }

      .right {
        flex: 0.9;
        text-align: left;
        padding-top: 0;
      }

      .title {
        font-size: 36px;
        line-height: 1.5;
      }

      .text {
        font-size: 16px;
        padding-top: 20px;
        padding-bottom: 30px;
      }

      .button {
        padding: 16px 70px;
        font-size: 15px;
      }

      .footer {
        justify-content: flex-end;
        margin-top: 20px;
      }
    }
    
  </style>
</head>

<body>
  <header>
    <img class="logo" src="./images/logo.svg" alt="Huddle"/>
  </header>
  <div class="main">
    <div class="left">
      <img class="main-img" src="./images/illustration-mockups.svg" alt="illustration-mockups"/>
    </div>
    <div class="right">
      <h1 class="title">Build The Community Your Fans Will Love</h1>

      <p class="text">Huddle re-imagines the way we build communities. You have a voice, but so does your audience. 
      Create connections with your users as you engage in genuine discussion.</p> 

      <button class="button">Register</button>
    </div>
  </div>
  <div class="footer">
    <div class="footer-logo">
      <a href="#" class="icon-circle"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="icon-circle"><i class="fab fa-twitter"></i></a>
      <a href="#" class="icon-circle"><i class="fab fa-instagram"></i></a>
    </div>
  </div>
</body>
</html>
